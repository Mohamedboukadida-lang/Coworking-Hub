# Database connection. Set DB_URL / DB_USERNAME / DB_PASSWORD in the environment;
# never commit real credentials to this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8081}

# JWT signing secret (at least 32 bytes). If unset, a random key is generated at startup
# and tokens stop working after a restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:PT24H}
# Changes always need a token. false: the catalogue (spaces, rooms, equipment) is public; true: token needed for it too
app.security.require-auth=${APP_SECURITY_REQUIRE_AUTH:false}
# First administrator, created at startup if no account has this email (admins cannot self-register).
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
